name: Import Famz Coffee OS source

on:
  push:
    branches:
      - main
    paths:
      - Famz-Coffee-OS-source.zip

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract production source
        run: |
          unzip -o Famz-Coffee-OS-source.zip
          rm Famz-Coffee-OS-source.zip
          rm -f .github/workflows/import-source.yml

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Famz Coffee OS production source"
          git push
